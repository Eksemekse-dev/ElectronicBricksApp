name: Build BuWizzPad (GitHub Only)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare AppIcon
        run: |
          set -euo pipefail
          ICON_SRC="ElectronicBricksApp/Icon/Ikona.png"
          ICONSET_DIR="ElectronicBricksApp/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET_DIR"

          sips -s format png -z 1024 1024 "$ICON_SRC" --out "$ICONSET_DIR/icon-1024.png"

          cat << 'EOF' > "$ICONSET_DIR/Contents.json"
          {
            "images" : [
              {
                "filename" : "icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS app without signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "BuWizzPad.xcodeproj" \
            -scheme "BuWizzPad" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build | xcbeautify

      - name: Create unsigned IPA artifact
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          APP_DIR=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          test -n "$APP_DIR"
          cp -R "$APP_DIR" build/Payload/
          cd build && zip -r -y BuWizzPad-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BuWizzPad-unsigned-ipa
          path: build/BuWizzPad-unsigned.ipa
