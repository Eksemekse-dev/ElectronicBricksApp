name: BuWizzPad
options:
  bundleIdPrefix: com.kacper.buwizzpad
  deploymentTarget:
    iOS: "16.0"
targets:
  BuWizzPad:
    type: application
    platform: iOS
    sources:
      - path: BuWizzPad
      - path: Assets.xcassets
    info:
      path: BuWizzPad/Info.plist
      properties:
        CFBundleDisplayName: BuWizzPad
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Aplikacja pobiera obraz z kamery w aucie przez sieć Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBluetoothAlwaysUsageDescription: Aplikacja łączy się z hubem (BuWizz3, Powered Up, Pybricks) przez Bluetooth Low Energy.
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
